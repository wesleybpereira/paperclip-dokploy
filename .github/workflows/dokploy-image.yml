name: Dokploy image

# Builds the Paperclip image on GitHub runners and publishes it to GHCR.
# Dokploy then pulls the ready image instead of compiling on the VPS.
on:
  push:
    branches: [ci/dokploy-image, dokploy-config]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dokploy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:dokploy-latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Registry cache keeps the Rust and pnpm layers warm between runs.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          provenance: false
